<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأخوين مفتي للملابس التقليدية الرجالية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* خلفية مدمجة أنيقة ذات طابع تراثي رجالي راقٍ مع طبقة عتمة لتبرز النصوص والأزرار */
            background: linear-gradient(rgba(15, 15, 15, 0.8), rgba(20, 20, 20, 0.9)), 
                        url('https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(25, 25, 25, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.35); /* إطار ذهبي هادئ يعكس الأصالة */
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* صورة البروفايل الجديدة: صورة رجالية تراثية ومحتشمة (طربوش / لباس تقليدي) */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d4af37;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .tagline {
            font-size: 0.95rem;
            color: #d4af37; /* لون ذهبي ناعم */
            margin-bottom: 25px;
            font-weight: 500;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* تصميم الأزرار لتكون بارزة ومريحة جداً للضغط */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .link-btn:hover {
            transform: translateY(-3px);
        }

        .link-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* زر الواتساب بتأثيره المميز */
        .whatsapp-btn:hover {
            background: #25d366 !important;
            border-color: #25d366 !important;
            color: #fff !important;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* زر الموقع الجغرافي */
        .map-btn:hover {
            background: #4285F4 !important;
            border-color: #4285F4 !important;
            color: #fff !important;
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #aaaaaa;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة الشعار الجديدة: معبرة عن التراث الرجالي التقليدي المحتشم -->
        <img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=300&q=80" alt="شعار متجر الأخوين مفتي" class="profile-img">
        
        <h1>متجر الأخوين مفتي</h1>
        <p class="tagline">للملابس التقليدية الرجالية | فخامة الأناقة والتراث</p>

        <div class="links-container">
            <!-- زر الواتساب -->
            <a href="https://wa.me/212606493766" target="_blank" class="link-btn whatsapp-btn">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                تواصل عبر الواتساب
            </a>

            <!-- زر الموقع الجغرافي -->
            <a href="https://goo.gl/maps/B4KSdzLfnZyKJGXB8?g_st=awb" target="_blank" class="link-btn map-btn">
                <svg viewBox="0 0 24 24"><path d="M12 0c-4.198 0-8 3.403-8 7.602 0 4.198 3.469 9.21 8 16.398 4.531-7.188 8-12.2 8-16.398 0-4.199-3.801-7.602-8-7.602zm0 11c-1.657 0-3-1.343-3-3s1.343-3 3-3 3 1.343 3 3-1.343 3-3 3z"/></svg>
                موقع المحل على الخريطة
            </a>
        </div>

        <div class="footer">
            متجر الأخوين مفتي &copy; 2026 - جميع الحقوق محفوظة
        </div>
    </div>

</body>
</html>
